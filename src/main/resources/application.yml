server:
  port: 8081
---
spring:
  mvc:
    servlet:
      path: /api
---
spring:
  profiles:
    active: local # local / dev / prod

---
spring:
  config:
    activate:
      on-profile: local
    import: classpath:config/datasource/datasource-local.yml

---
spring:
  config:
    activate:
      on-profile: dev
    import: classpath:config/datasource/datasource-dev.yml

---
spring:
  config:
    activate:
      on-profile: prod
    import: classpath:config/datasource/datasource-prod.yml

---
spring:
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
---
# 기존 application.yml 에 추가
seoul:
  api:
    base-url: http://openapi.seoul.go.kr:8088
    key: ${SEOUL_API_KEY}          # IntelliJ Run > Edit Configurations > Environment variables
    page-size: 1000

# Feign 로그 (개발 중 API 요청/응답 확인용, 운영에선 NONE으로)
logging:
  level:
    com.neogulss.feign: DEBUG

feign:
  client:
    config:
      seoulApi:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: BASIC

