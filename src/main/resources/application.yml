server:
  port: 8081
---
spring:
  mvc:
    servlet:
      path: /api
---
spring:
  profiles:
    active: local # local / dev / prod

---
spring:
  config:
    activate:
      on-profile: local
    import: classpath:config/datasource/datasource-local.yml

---
spring:
  config:
    activate:
      on-profile: dev
    import: classpath:config/datasource/datasource-dev.yml

---
spring:
  config:
    activate:
      on-profile: prod
    import: classpath:config/datasource/datasource-prod.yml

---
spring:
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000