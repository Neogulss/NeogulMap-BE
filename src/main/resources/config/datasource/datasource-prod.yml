spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://neogulmap-db.cvwu6kmsuek2.ap-northeast-2.rds.amazonaws.com:3306/neogulmap_prod_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: admin
    password: ${PROD_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

mybatis:
  type-aliases-package: com.neogulss.neogulmap
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true